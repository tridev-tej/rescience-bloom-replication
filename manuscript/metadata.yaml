abstract: "A Bloom filter can have a low average false-positive rate while returning many false positives for particular keys. This partial replication of Almeida’s finite-size analysis recomputes 124 cells from four tables and matches 99 at the reported precision. The largest discrepancies are at low load. A bound rules out the choice of a common positive integer insertion count as an explanation for four mean-rate gaps at 64 bits. At 512 bits and eight probes, exact enumeration finds a 49.81 percent false-positive rate for zero-step queries under standard double hashing. Partitioning removes step-dependent variation in this model and raises the average rate from 0.649 to 1.442 percent."
