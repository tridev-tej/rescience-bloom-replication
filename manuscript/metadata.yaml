abstract: "Under independent uniform hashing, four partitioned-to-standard mean false-positive ratios in Almeida’s Table 2 at 64 bits exceed a bound valid for every common positive integer insertion count in both layouts. Rounding cannot explain these quarter- and half-nominal-load values with four or eight probes. Almeida reports a loop error and a matching corrected example (personal communication, 7 November 2026); we have not independently reproduced his diagnosis. This partial replication recovers nominal-load mean rates and the concentration of false positives among keys with repeated probes. It matches 99 of 124 original printed cell occurrences across four tables, counting repeats in each table, and retains all 25 differences. An exact double-hashing extension at 512 bits, eight probes, and 44 insertions gives zero-step standard queries a 49.81 percent false-positive rate. Partitioning removes step-dependent variation in this uniform hash-pair model and raises the mean rate from 0.649 to 1.442 percent."
